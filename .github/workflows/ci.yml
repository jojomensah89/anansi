name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck

  build-web:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/web build

  build-extension:
    runs-on: ubuntu-latest
    needs: test
    # This job validates the artifact build only; it never publishes the
    # bundle, so use inert values instead of embedding a production secret.
    env:
      ANANSI_EXTENSION_ORIGIN: https://ci.invalid
      ANANSI_EXTENSION_INGEST_TOKEN: ci-build-placeholder-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/extension compile
      - run: bun run --cwd apps/extension build
